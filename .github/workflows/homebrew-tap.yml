name: Update Homebrew tap

on:
  release:
    types: [published]

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-cask:
    name: Bump choux casks
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-latest
    steps:
      - name: Resolve version and casks
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag $TAG is not vX.Y.Z"; exit 1 ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if [ "$PRERELEASE" = "true" ]; then
            echo "CASKS=choux@rc" >> "$GITHUB_ENV"
          else
            echo "CASKS=choux choux@rc" >> "$GITHUB_ENV"
          fi

      - name: Download arm64 DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="choux_${VERSION}_aarch64.dmg"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" \
            --dir .
          test -f "$asset" || { echo "::error::$asset not in release $TAG"; exit 1; }
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Compute SHA-256
        run: |
          sha="$(shasum -a 256 "$ASSET" | cut -d' ' -f1)"
          echo "SHA256=$sha" >> "$GITHUB_ENV"
          echo "$sha  $ASSET"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: pty-server/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump version and checksum
        run: |
          for token in $CASKS; do
            cask="tap/Casks/$token.rb"
            test -f "$cask" || { echo "::error::$cask not found in tap"; exit 1; }
            sed -i '' -E "s|^  version \".*\"$|  version \"$VERSION\"|" "$cask"
            sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" "$cask"
            grep -q "version \"$VERSION\"" "$cask" || { echo "::error::version not applied to $token"; exit 1; }
            grep -q "sha256 \"$SHA256\"" "$cask" || { echo "::error::sha256 not applied to $token"; exit 1; }
            git -C tap --no-pager diff -- "Casks/$token.rb"
          done

      - name: Verify only version and checksum changed
        run: |
          for token in $CASKS; do
            changed="$(git -C tap diff --numstat -- "Casks/$token.rb" | awk '{print $1"/"$2}')"
            case "$changed" in
              ""|"2/2"|"1/1") ;;
              *) echo "::error::unexpected $token diff ($changed lines added/removed)"; exit 1 ;;
            esac
          done

      - name: Audit casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          brew tap pty-server/tap
          for token in $CASKS; do
            cp "tap/Casks/$token.rb" "$(brew --repository pty-server/tap)/Casks/$token.rb"
            brew audit --cask --strict --online "pty-server/tap/$token"
          done

      - name: Commit and push
        run: |
          git -C tap config user.name "choux-release"
          git -C tap config user.email "noreply@pty-server.dev"
          pushed=0
          for token in $CASKS; do
            if git -C tap diff --quiet -- "Casks/$token.rb"; then
              echo "$token already at $VERSION"
              continue
            fi
            git -C tap commit -m "chore($token): $VERSION" -- "Casks/$token.rb"
            pushed=1
          done
          if [ "$pushed" = "1" ]; then
            git -C tap push
          fi
