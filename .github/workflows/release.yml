name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BUNDLE_ID: dev.pty-server.choux
  TEAM_ID: 5AU27XG69A

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag v$tag does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version $conf"

  # One release, created once. Letting each build job find-or-create its own left
  # v0.2.2 with the Linux bundles on the published release and the notarized dmg
  # stranded on a second, draft release for the same tag.
  create-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            -q "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first | .id // empty")"
          if [ -n "$existing" ]; then
            echo "reusing release $existing"
            echo "release_id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Choux $GITHUB_REF_NAME" \
            -F draft=true \
            -F prerelease="$prerelease" \
            -q .id)"
          echo "created release $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux bundles
            os: ubuntu-latest
            args: ""
            rust_targets: ""
          - name: macOS arm64 (signed, notarized)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev build-essential pkg-config libssl-dev libxdo-dev patchelf

      - name: Check updater signing secrets are present
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - name: Check signing secrets are present
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi

      - name: Write App Store Connect API key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Build and upload to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # The dmg bundler folds the .app into the disk image and then deletes it,
      # so the shipped app can only be verified from inside the mounted dmg and
      # the updater archive.
      - name: Locate a single aarch64 DMG
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          dmgs=("$bundle"/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one dmg, found ${#dmgs[@]}"
            exit 1
          fi
          case "${dmgs[0]}" in
            *_aarch64.dmg) echo "${dmgs[0]}" ;;
            *) echo "::error::dmg is not aarch64: ${dmgs[0]}"; exit 1 ;;
          esac
          echo "DMG_PATH=${dmgs[0]}" >> "$GITHUB_ENV"

      - name: Mount the DMG
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          mount_point="$RUNNER_TEMP/dmg"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$mount_point"
          echo "MOUNT_POINT=$mount_point" >> "$GITHUB_ENV"
          apps=("$mount_point"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .app in $DMG_PATH, found ${#apps[@]}"
            exit 1
          fi
          echo "${apps[0]}"
          echo "APP_PATH=${apps[0]}" >> "$GITHUB_ENV"

      - name: Unpack the updater archive
        if: runner.os == 'macOS'
        run: |
          shopt -s nullglob
          bundle="src-tauri/target/aarch64-apple-darwin/release/bundle"
          archives=("$bundle"/macos/*.app.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::expected exactly one updater archive, found ${#archives[@]}"
            exit 1
          fi
          if [ ! -s "${archives[0]}.sig" ]; then
            echo "::error::${archives[0]} has no signature"
            exit 1
          fi
          unpacked="$RUNNER_TEMP/updater"
          mkdir -p "$unpacked"
          tar -xzf "${archives[0]}" -C "$unpacked"
          apps=("$unpacked"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .app in ${archives[0]}, found ${#apps[@]}"
            exit 1
          fi
          echo "${apps[0]}"
          echo "UPDATER_APP_PATH=${apps[0]}" >> "$GITHUB_ENV"

      - name: Verify code signature
        if: runner.os == 'macOS'
        run: |
          for app in "$APP_PATH" "$UPDATER_APP_PATH"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          done

      - name: Verify signing team
        if: runner.os == 'macOS'
        run: |
          for app in "$APP_PATH" "$UPDATER_APP_PATH"; do
            got="$(codesign --display --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [ "$got" != "$TEAM_ID" ]; then
              echo "::error::$app signed by team $got, expected $TEAM_ID"
              exit 1
            fi
            echo "$app: $got"
          done

      - name: Verify Gatekeeper acceptance
        if: runner.os == 'macOS'
        run: |
          for app in "$APP_PATH" "$UPDATER_APP_PATH"; do
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: Verify notarization ticket
        if: runner.os == 'macOS'
        run: |
          for app in "$APP_PATH" "$UPDATER_APP_PATH"; do
            xcrun stapler validate "$app"
          done

      - name: Verify bundle identifier
        if: runner.os == 'macOS'
        run: |
          for app in "$APP_PATH" "$UPDATER_APP_PATH"; do
            got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            if [ "$got" != "$BUNDLE_ID" ]; then
              echo "::error::$app bundle identifier is $got, expected $BUNDLE_ID"
              exit 1
            fi
            echo "$app: $got"
          done

      - name: Verify the updater archive holds the dmg build
        if: runner.os == 'macOS'
        run: |
          cdhash() { codesign --display --verbose=4 "$1" 2>&1 | sed -n 's/^CDHash=//p'; }
          dmg="$(cdhash "$APP_PATH")"
          updater="$(cdhash "$UPDATER_APP_PATH")"
          if [ -z "$dmg" ] || [ "$dmg" != "$updater" ]; then
            echo "::error::updater app CDHash '$updater' does not match dmg app '$dmg'"
            exit 1
          fi
          echo "$dmg"

      - name: Unmount the DMG
        if: always() && runner.os == 'macOS' && env.MOUNT_POINT != ''
        run: hdiutil detach "$MOUNT_POINT" || hdiutil detach "$MOUNT_POINT" -force

  # Guards against publishing a release that is missing a platform's bundles, which
  # is what left v0.2.2 shipping without its dmg.
  check-assets:
    name: Check every bundle uploaded
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: List the draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          names="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate -q '.[].name')"
          echo "$names"
          missing=""
          for expected in "choux_${version}_aarch64.dmg" \
                          "choux_${version}_amd64.deb" \
                          "choux_${version}_amd64.AppImage"; do
            printf '%s\n' "$names" | grep -qxF "$expected" || missing="$missing $expected"
          done
          if [ -n "$missing" ]; then
            echo "::error::draft release is missing:$missing"
            exit 1
          fi

      - name: Check the updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            -q '.[] | select(.name == "latest.json") | .id')"
          if [ -z "$asset_id" ]; then
            echo "::error::draft release is missing latest.json"
            exit 1
          fi
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > latest.json
          jq . latest.json
          announced="$(jq -r .version latest.json)"
          if [ "$announced" != "$version" ]; then
            echo "::error::latest.json announces $announced, expected $version"
            exit 1
          fi
          missing=""
          for targets in "darwin-aarch64-app darwin-aarch64" \
                         "linux-x86_64-appimage linux-x86_64" \
                         "linux-x86_64-deb"; do
            found=""
            for target in $targets; do
              if jq -e --arg target "$target" \
                '.platforms[$target] | select((.url // "") != "" and (.signature // "") != "")' \
                latest.json > /dev/null; then
                found="$target"
                break
              fi
            done
            [ -n "$found" ] || missing="$missing ${targets%% *}"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json has no signed update for:$missing"
            exit 1
          fi
